[project]
name = "nwt-backend"
version = "0.1.0"
description = "Read-only observer: daily report + localhost API over the engine's risk db"
requires-python = ">=3.12"
# Deliberately NOT dependent on nwt-risk: the observer reads the risk db FILE,
# never the risk code, so it can never construct a broker, load credentials, or
# place an order (enforced by the import-linter contract in the root pyproject).
# nwt-engine is admitted for exactly two read-side pieces: the sleeve ledger
# fold and the parquet bar store.
dependencies = [
    "nwt-contracts",
    "nwt-engine",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "typer>=0.12",
]

[project.scripts]
nwt-backend = "nwt_backend.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nwt_backend"]
