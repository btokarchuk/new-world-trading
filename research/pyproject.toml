[project]
name = "nwt-research"
version = "0.1.0"
description = "Research bridge: vectorized references, walk-forward splits, bootstrap CIs, signal-parity harness"
requires-python = ">=3.12"
dependencies = [
    "nwt-contracts",
    "nwt-engine",
    "pandas>=2.2",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nwt_research"]
