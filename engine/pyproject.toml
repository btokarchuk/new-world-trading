[project]
name = "nwt-engine"
version = "0.1.0"
description = "Core trading engine: domain, event loop, sleeves, brokers, data, strategies, experiments"
requires-python = ">=3.12"
dependencies = [
    "nwt-contracts",
    "pydantic>=2.7",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "typer>=0.12",
    "pyyaml>=6.0",
    "exchange-calendars>=4.5",
    "httpx>=0.27",
]

[project.scripts]
nwt = "nwt_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nwt_engine"]
