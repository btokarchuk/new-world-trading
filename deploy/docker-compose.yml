# Attended paper stack. `make up` starts it; workflows run via `make cycle` etc.
#
# Isolation posture:
#   - code runs as non-root inside the container, never as the host user
#   - secrets and config are mounted READ-ONLY; the container cannot rewrite
#     its own limits or exfiltrate keys by editing files
#   - data/ is the single writable mount (ledgers, dbs, parquet)
#   - watchdog (Phase 4b) gets its own service and its OWN key file, so a
#     compromised engine cannot silence its supervisor

name: nwt

x-common: &common
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: nwt-stack:local
  working_dir: /app
  environment:
    # Corporate TLS-intercepting proxies need their CA inside the container too.
    # Unset on a clean network; harmless when the path does not exist.
    SSL_CERT_FILE: ${NWT_CA_CERT:-/etc/ssl/certs/ca-certificates.crt}
    TZ: America/New_York
  volumes:
    - ../data:/app/data
    - ../config:/app/config:ro
    - ../secrets:/app/secrets:ro
    - ${NWT_CA_DIR:-/etc/ssl/certs}:/certs:ro

services:
  engine:
    <<: *common
    container_name: nwt-engine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import nwt_risk, nwt_engine"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
