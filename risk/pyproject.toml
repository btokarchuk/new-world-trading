[project]
name = "nwt-risk"
version = "0.1.0"
description = "RiskGovernor, pre-trade checks, circuit breakers, state machine, reconciliation"
requires-python = ">=3.12"
dependencies = [
    "nwt-contracts",
    "nwt-engine",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.scripts]
nwt-risk = "nwt_risk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nwt_risk"]
