[project]
name = "nwt-contracts"
version = "0.1.0"
description = "Seam types shared by the engine and risk layers. Keep tiny; pydantic only."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nwt_contracts"]
