[project]
name = "nwt-watchdog"
version = "0.1.0"
description = "Independent process supervisor: shares no code with the engine it watches"
requires-python = ">=3.12"
# Deliberately NOT dependent on nwt-engine / nwt-risk / nwt-contracts: a bug in
# the supervised system must be unable to exist in its supervisor.
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
nwt-watchdog = "nwt_watchdog.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nwt_watchdog"]
